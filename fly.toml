# fly.toml app configuration file for scienpay-app
app = "scienpay-app"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "node apps/api/dist/infrastructure/database/migrate.js && node apps/api/dist/infrastructure/database/seed.js"

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "15s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/api/v1/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
