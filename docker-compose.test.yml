# PostgreSQL aislado para la suite de integración (HANDOFF 4.1).
# Uso local:   docker compose -f docker-compose.test.yml up -d
# Apagado:     docker compose -f docker-compose.test.yml down -v
#
# Se usa el puerto 55432 para no chocar con el PostgreSQL de desarrollo (5432)
# ni con el volumen de `docker-compose.yml`.
services:
  postgres-test:
    image: postgres:16-alpine
    container_name: scienpay_test_db
    restart: 'no'
    environment:
      POSTGRES_DB: ${INTEGRATION_DB_NAME:-scienpay_test}
      POSTGRES_USER: ${INTEGRATION_DB_USER:-scienpay_app}
      POSTGRES_PASSWORD: ${INTEGRATION_DB_PASSWORD:-scienpay_test_password}
    ports:
      - '${INTEGRATION_DB_PORT:-55432}:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${INTEGRATION_DB_USER:-scienpay_app} -d ${INTEGRATION_DB_NAME:-scienpay_test}',
        ]
      interval: 3s
      timeout: 5s
      retries: 20
